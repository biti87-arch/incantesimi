<style>
/* Telefono prima di tutto: una colonna, barra delle schede in basso, pulsanti da almeno 44 px. Colori della Collana. */
:root{
  --bg:#FAF3E0; --surface:#FFFDF7; --surface2:#F5EDD0; --line:#E2D2A6; --ink:#1F1A12; --muted:#6B5F48;
  --gold:#8B6914; --gold2:#D4A84B; --title:#C45911; --cond:#C00000; --adv:#1E7A1E; --mark:#FFF1C9;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#16130E; --surface:#201B13; --surface2:#2B2419; --line:#45392A; --ink:#EDE5D3; --muted:#A99D85; --gold:#D4A84B; --gold2:#8B6914; --title:#EC915A; --cond:#FF7070; --adv:#5FBF5F; --mark:#3B3020; --field:#14110C; --on-gold:#1A140A; --xbg:#2E2840; --xink:#C9B8F0; --nobg:#3D1C1C; color-scheme:dark;} }
:root[data-theme="dark"]{--bg:#16130E; --surface:#201B13; --surface2:#2B2419; --line:#45392A; --ink:#EDE5D3; --muted:#A99D85; --gold:#D4A84B; --gold2:#8B6914; --title:#EC915A; --cond:#FF7070; --adv:#5FBF5F; --mark:#3B3020; --field:#14110C; --on-gold:#1A140A; --xbg:#2E2840; --xink:#C9B8F0; --nobg:#3D1C1C; color-scheme:dark;}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 12px calc(78px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1100px;margin:0 auto;min-width:0}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}

nav.tabs button{flex:1;min-height:56px;border:0;background:none;font:600 .8rem var(--f-body);color:var(--muted);border-top:3px solid transparent;cursor:pointer}

section.panel{display:grid;gap:12px;padding-top:12px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:0 0 8px;color:var(--title)}

input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);min-width:0;width:100%}

.dlg{display:flex;flex-direction:column;height:100%;max-height:100dvh}

  nav.tabs{position:sticky;top:0;bottom:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
  section.panel.due{grid-template-columns:1fr 1fr;align-items:start}
}

<div class="wrap">

  <div class="riass" id="riass"></div>
</header>
<main id="main"></main>
<nav class="tabs" role="tablist">
  <button data-tab="pg" role="tab">Personaggio</button>
  <button data-tab="oggi" role="tab">Oggi</button>
  <button data-tab="libro" role="tab">Libro</button>

<dialog id="dlg"><div class="dlg"><div class="dlgh"><h2 id="dlgT"></h2><button class="mini" id="dlgX">Chiudi</button></div><div class="dlgb" id="dlgB"></div></div></dialog>
<script>
const DATI = __DATI__;
__MOTORE__
Motore.imposta(DATI);
const M = Motore, SC = DATI.schede;
const CHIAVE = 'libro-incantesimi-v1';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const CAR = { Int: 'Intelligenza', Sag: 'Saggezza', Car: 'Carisma' };
const SCUOLE = [...new Set(SC.map(s => s.scuola))].sort();
const DESCR = [...new Set(SC.flatMap(s => s.descr))].sort();
const COND = 'Azzoppat[oaie]|Colt[oaie] alla sprovvista|Offuscat[oaie]|Affaticat[oaie]|Abbagliat[oaie]|Accecat[oaie]|Accovacciat[oaie]|Affascinat[oaie]|Assordat[oaie]|Barcollant[ei]|Confus[oaie]|Esaust[oaie]|Frastornat[oaie]|Immobilizzat[oaie]|Impreparat[oaie]|In Lotta|Inabil[ei]|Incorpore[oaie]|Indifes[oaie]|Inferm[oaie]|Intralciat[oaie]|Invisibil[ei]|Mort[oaie]|Nauseat[oaie]|Paralizzat[oaie]|Scoss[oaie]|Spaventat[oaie]|In Preda al Panico|Pietrificat[oaie]|Priv[oaie] di Sensi|Pron[oaie]|Sanguinant[ei]|Stabilizzat[oaie]|Stordit[oaie]';
const RE_COND = new RegExp('\\b(' + COND + ')\\b', 'g');

// ---------------------------------------------------------------- stato
let ST;
function nuovoPg(nome) {
  return { id: uid(), nome: nome || 'Nuovo personaggio', ucm: 0, note: '', ci: 0,
    classi: [nuovaClasse('Stregone')], bonus: [], meta: [], pergamene: [], bacchette: [], attivi: [], reag: {}, annulla: null,
    venti: { on: false, essenza: false, effetti: [] } };
}
function nuovaClasse(c) { return { classe: c, livello: 1, car: DATI.classi[c].car[0], punteggio: 16, con: [], prep: {}, usati: {}, sup: 0, sost: {} }; }
function carica() {
  try { ST = JSON.parse(localStorage.getItem(CHIAVE)); } catch (e) { ST = null; }
  if (!ST || !ST.pg || !ST.pg.length) { const p = nuovoPg('Nuovo personaggio'); ST = { v: 1, attivo: p.id, pg: [p], tab: 'pg' }; }
  // bacchette della v1.0.1 (nessuna carica tranne le Cura): 1 carica al giorno, Cura 3 (Vol. 3)
  for (const p of ST.pg) for (const b of p.bacchette || []) {
    if (b.max == null) b.max = M.caricheMax(nomeCon(b), b.cariche != null ? 3 : 1);
    if (b.cariche == null) b.cariche = b.max;
  }
  // Venti della magia (v6): spenti di base
  for (const p of ST.pg) if (!p.venti) p.venti = { on: false, essenza: false, effetti: [] };
}
function salva() { try { localStorage.setItem(CHIAVE, JSON.stringify(ST)); } catch (e) { toast('Salvataggio non riuscito: ' + e.message); } }
const PG = () => ST.pg.find(p => p.id === ST.attivo) || ST.pg[0];
const CLS = (pg) => (pg = pg || PG()).classi[Math.min(pg.ci || 0, pg.classi.length - 1)];
const ctxDi = (pg, cl) => ({ classe: cl.classe, livello: cl.livello, punteggio: cl.punteggio, bonus: pg.bonus.filter(b => !b.classe || b.classe === cl.classe) });

// ---------------------------------------------------------------- utilità sugli incantesimi
const keyCon = c => c.s + '|' + (c.v || '');
const nomeCon = c => c.v || SC[c.s].n;
// livello di un incantesimo nella lista di una classe (variante compresa) o null
function livelloLista(classe, s, v) {
  const L = DATI.liste[classe] || {};
  for (const l in L) if (L[l].some(x => Array.isArray(x) ? (x[0] === s && x[1] === v) : (x === s && !v))) return +l;
  return null;
}
// tutti i livelli di una scheda (per gli extra e gli oggetti): [{classe, L, v}]
function livelliScheda(s) {
  const out = [];
  const sc = SC[s];
  for (const c in sc.lv) out.push({ classe: c, L: sc.lv[c] });
  for (const v of sc.var || []) for (const c in v.lv) out.push({ classe: c, L: v.lv[c], v: v.n });
  return out;
}
const minLivello = s => { const l = livelliScheda(s).map(x => x.L); return l.length ? Math.min(...l) : 1; };
function numeroLista(classe, L, s, v) {
  const arr = (DATI.liste[classe] || {})[L] || [];
  return arr.findIndex(x => Array.isArray(x) ? (x[0] === s && x[1] === v) : (x === s && !v)) + 1;
}

// ---------------------------------------------------------------- interfaccia generale
function toast(t, ms) {
  const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = t; (dlg && dlg.open ? dlg : document.body).appendChild(d);
  setTimeout(() => d.remove(), ms || 2600);
}
var dlg = $('#dlg');
// risultato di un tiro: riquadro fisso in fondo alla scheda aperta (prima finiva sotto il dialogo modale e non si vedeva)
function mostraTiro(html) {
  const b = $('#dlgB');
  if (!dlg.open) return toast(html, 5000);
  let r = b.querySelector('.tiro');
  if (!r) { r = document.createElement('div'); r.className = 'tiro'; b.appendChild(r); }
  r.innerHTML = `<span>${html}</span><button class="mini" aria-label="Chiudi il tiro">✕</button>`;
  r.querySelector('button').onclick = () => r.remove();
}
function tiraEMostra(espr, nome, rit) {
  const r = M.tiraValore(espr, null, rit);
  if (!r) return;
  const det = (r.colpi.length > 1 ? 'colpi: ' + r.colpi.join(', ') : (r.tiri.length ? 'dadi: ' + r.tiri.join(', ') : '')) + (rit ? `${r.colpi.length > 1 || r.tiri.length ? ' · ' : ''}ritirati ${r.ritirati} (risultati 1${rit > 1 ? '–2' : ''})` : '');
  mostraTiro(`${nome ? esc(nome) + ' · ' : ''}${esc(espr)} → <b>${r.tot}</b>${det ? ` <span class="muted">(${det})</span>` : ''}`);
}
function apri(titolo, html, dopo) { $('#dlgT').textContent = titolo; $('#dlgB').innerHTML = html; if (!dlg.open) dlg.showModal(); $('#dlgB').scrollTop = 0; if (dopo) dopo($('#dlgB')); }
function chiudi() { if (dlg.open) dlg.close(); }
function chiedi(titolo, testo, si) {
  apri(titolo, `<p>${testo}</p><div class="row"><button class="pri" id="cSi">Conferma</button><button id="cNo">Annulla</button></div>`, x => { $('#cSi', x).onclick = () => { chiudi(); si(); }; $('#cNo', x).onclick = chiudi; });
}
$('#dlgX').onclick = chiudi;

function riassunto() {
  const pg = PG(), cl = CLS(pg), ctx = ctxDi(pg, cl);
  const mod = M.modCar(cl.punteggio);
  $('#riass').innerHTML = `<span class="pill">${esc(cl.classe)} <b>${cl.livello}</b></span>` +
    `<span class="pill">LI <b>${M.LI(ctx, null)}</b></span>` +
    `<span class="pill">CD base <b>${10 + mod + M.somma(ctx.bonus, 'cd', null, cl.classe)}</b>+liv.</span>` +
    `<span class="pill">Conc. <b>+${M.concentrazione(ctx, null, false)}</b>` + (M.concentrazione(ctx, null, true) !== M.concentrazione(ctx, null, false) ? ` (dif. +${M.concentrazione(ctx, null, true)})` : '') + `</span>` +
    `<span class="pill">RI <b>+${M.RI(ctx, null)}</b></span>` +
    (pg.classi.length > 1 ? `<button class="mini" id="cambiaCl">Classe: ${esc(cl.classe)} ⇄</button>` : '');
  const b = $('#cambiaCl'); if (b) b.onclick = () => { pg.ci = (pg.ci + 1) % pg.classi.length; salva(); disegna(); };
  $('#selPg').innerHTML = ST.pg.map(p => `<option value="${p.id}" ${p.id === pg.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
}
const TEMI = { auto: 'Tema: auto', light: 'Tema: chiaro', dark: 'Tema: scuro' };
function applicaTema() { const t = ST.tema || 'dark'; if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; $('#bTema').textContent = { auto: '◐', light: '☀', dark: '☾' }[t]; $('#bTema').title = TEMI[t]; }
$('#bTema').onclick = () => { ST.tema = { dark: 'light', light: 'auto', auto: 'dark' }[ST.tema || 'dark']; salva(); applicaTema(); toast(TEMI[ST.tema]); };
$('#selPg').onchange = e => { ST.attivo = e.target.value; salva(); disegna(); };
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { ST.tab = b.dataset.tab; salva(); disegna(); window.scrollTo(0, 0); });

// tendine dei livelli (Libro, Personaggio, Oggi): chiuse di base, lo stato si ricorda (Massy, 17/11)
const aperto = k => !!(ST.aperti && ST.aperti[k]);
document.addEventListener('click', e => { const b = e.target.closest('[data-tend]'); if (!b) return; ST.aperti = ST.aperti || {}; const k = b.dataset.tend; if (ST.aperti[k]) delete ST.aperti[k]; else ST.aperti[k] = true; salva(); disegna(); });
function disegna() {
  riassunto();
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === ST.tab));
  ({ pg: tabPg, oggi: tabOggi, libro: tabLibro, oggetti: tabOggetti }[ST.tab] || tabPg)();
}

// ---------------------------------------------------------------- scheda di un incantesimo
// opz: {s, v, cl, L, liOgg, cdOgg, lancio:true, oggetto}
function htmlTesto(t, forms, li, meta) {
  let out = '', last = 0;
  for (const f of (forms || []).slice().sort((a, b) => a.i - b.i)) {
    if (f.i < last) continue;
    const r = M.formula(f, li, /dann/i.test(t.slice(f.i, f.j)) ? meta : Object.assign({}, meta, { danni: null }));
    out += colora(esc(t.slice(last, f.i))) + `<span class="fx">${esc(t.slice(f.i, f.j))}</span><span class="calc" data-tira="${esc(r)}">${esc(r)}</span>`;
    last = f.j;
  }
  return out + colora(esc(t.slice(last)));
}
const colora = h => h.replace(RE_COND, '<span class="cond">$1</span>').replace(/\b(\d+d\d+(?:\+\d+)?)\b/g, '<span class="dado" data-tira="$1">$1</span>');
function htmlDesc(s, li, meta) {
  let h = '', tab = null, riga = null;
  const chiudiTab = () => { if (tab) { h += '<table>' + tab + '</tr></table>'; tab = null; riga = null; } };
  for (const p of s.desc) {
    if (p.c != null) {
      if (tab === null) { tab = '<tr>'; riga = p.c; }
      else if (p.c !== riga) { tab += '</tr><tr>'; riga = p.c; }
      tab += '<td>' + htmlTesto(p.t, p.f, li, meta) + '</td>';
      continue;
    }
    chiudiTab();
    h += `<p class="${p.m ? 'mod' : ''}">${p.l ? '• ' : ''}${htmlTesto(p.t, p.f, li, meta)}</p>`;
  }
  chiudiTab();
  return h;
}
function apriScheda(o) {
  const pg = PG(), cl = o.cl || CLS(pg), ctx = ctxDi(pg, cl), s = SC[o.s];
  const L = o.L != null ? o.L : (livelloLista(cl.classe, o.s, o.v) ?? minLivello(o.s));
  const stato = { meta: {}, intens: null, slotScelto: null, forza: new Set(o.forza || []) };
  const disegnaScheda = () => {
    const tal = talentiScelti(pg, stato);
    const bd = b => ctx.bonus.filter(x => x.ambito === 'danni' && (x.modo === 'dado') === b && M.siApplica(x, s, cl.classe)).reduce((a, x) => a + (+x.valore || 0), 0);

  }

function voceLista(x) { return Array.isArray(x) ? { s: x[0], v: x[1] } : { s: x }; }
// scelta di più conosciuti alla volta (v3, Massy 17/11): caselle, al massimo i posti liberi del livello
function scegliDaLista(cl, L, opz) {
  const arr = (DATI.liste[cl.classe] || {})[L] || [];
  const presi = new Set(cl.con.map(keyCon));
  const lib = opz.lib > 0 ? opz.lib : 1;
  const scelti = new Set();
  const disegnaLista = filtro => arr.map((x, i) => ({ c: voceLista(x), i })).filter(({ c }) => !filtro || nomeCon(c).toLowerCase().includes(filtro))
    .map(({ c, i }) => { const k = keyCon(c); return `<li><span class="num">${i + 1}.</span><span class="n" data-pick="${esc(k)}">${esc(nomeCon(c))}</span>${presi.has(k) ? '<span class="tag">già conosciuto</span>' : `<input type="checkbox" data-sel="${esc(k)}" ${scelti.has(k) ? 'checked' : ''} ${!scelti.has(k) && scelti.size >= lib ? 'disabled' : ''} aria-label="Scegli">`}</li>`; }).join('');
  apri(`${opz.r ? 'R a mano' : 'Lista'} · ${cl.classe} ${L === 0 ? 'livello 0' : L + '°'}`, `<input id="cerca" placeholder="Cerca nella lista" autocomplete="off"><ul class="inc list-pick" id="lista">${disegnaLista('')}</ul>
    <div class="row piede"><span class="small muted grow" id="conta"></span><button class="pri" id="aggiungi" disabled>Aggiungi</button></div>`, b => {
    const conta = () => { $('#conta', b).textContent = `Scelti ${scelti.size} su ${lib} ${lib === 1 ? 'posto libero' : 'posti liberi'}`; const a = $('#aggiungi', b); a.disabled = !scelti.size; a.textContent = scelti.size > 1 ? `Aggiungi ${scelti.size}` : 'Aggiungi'; };
    const lega = () => {
      b.querySelectorAll('[data-sel]').forEach(e => e.onchange = () => {
        if (e.checked) scelti.add(e.dataset.sel); else scelti.delete(e.dataset.sel);
        b.querySelectorAll('[data-sel]').forEach(x => { x.disabled = !x.checked && scelti.size >= lib; });
        conta();
      });
      b.querySelectorAll('[data-pick]').forEach(e => e.onclick = () => { const [s, v] = e.dataset.pick.split('|'); apriScheda({ s: +s, v: v || undefined, cl, L }); });
    };
    lega(); conta();
    $('#cerca', b).oninput = e => { $('#lista', b).innerHTML = disegnaLista(e.target.value.toLowerCase()); lega(); };
    $('#aggiungi', b).onclick = () => {
      // nell'ordine della lista numerata
      for (const x of arr) { const c = voceLista(x); if (scelti.has(keyCon(c))) cl.con.push({ s: c.s, v: c.v, L, r: !!opz.r }); }
      const n = scelti.size; salva(); chiudi(); disegna(); toast(n > 1 ? `Aggiunti ${n} incantesimi` : 'Incantesimo aggiunto');
    };
  });
}
function tiraR(cl, L) {
  const arr = (DATI.liste[cl.classe] || {})[L] || [];
  const presi = cl.con.map(keyCon);
  const occ = arr.map((x, i) => presi.includes(keyCon(voceLista(x))) ? i + 1 : 0).filter(Boolean);
  const n = M.tiroRicerca(arr.length, occ);
  if (!n) return toast('Nessun incantesimo libero nella lista');
  const c = voceLista(arr[n - 1]);
  apri('Incantesimo di ricerca', `<p>Tiro sulla lista ${cl.classe}, ${L === 0 ? 'livello 0' : L + '° livello'} (1–${arr.length}):</p><p class="big">${n}</p><p><b>${esc(nomeCon(c))}</b></p><div class="row"><button class="pri" id="tieni">Segna come R</button><button id="vedi">Scheda</button></div>`, b => {
    $('#tieni', b).onclick = () => { cl.con.push({ s: c.s, v: c.v, L, r: true }); salva(); chiudi(); disegna(); };
    $('#vedi', b).onclick = () => apriScheda({ s: c.s, v: c.v, cl, L });
  });
}
// ricerca libera su tutte le schede (extra, oggetti, bonus su un incantesimo)
function cercaSchede(q, max) {
  q = q.toLowerCase().trim();
  const out = [];
  if (q.length < 2) return out;
  for (let i = 0; i < SC.length && out.length < (max || 40); i++) {
    const s = SC[i];
    if (s.n.toLowerCase().includes(q)) {
      if (s.var) for (const v of s.var) out.push({ s: i, v: v.n }); else out.push({ s: i });
    }
  }
  return out;
}

  const con = M.conosciuti(cl.classe, cl.livello, extraCon(pg, cl));

  for (const L of M.livelliMagia(cl.classe)) {
    if (tot[L] == null) continue;
    const u = cl.usati[L] || 0;
    h += `<div class="lvl"><div class="lvlh"><b>${L === 0 ? 'Livello 0' : L + '°'}</b><span class="small muted">${Math.max(0, tot[L] - u)}/${tot[L]} liberi</span></div><div class="dots" style="margin-top:4px">${[...Array(tot[L]).keys()].map(i => `<button class="dot ${i >= tot[L] - u ? 'usato' : ''}" data-dot="${L}" data-i="${i}" aria-label="slot ${L}° ${i + 1}"></button>`).join('')}${tot[L] === 0 ? '<span class="small muted">nessuno slot</span>' : ''}</div></div>`;
  }
  h += '</div>';
  // preparati e lancio
  h += `<div class="card"><h2>Incantesimi di oggi</h2><div class="small muted">Tocca un livello per aprirlo; spunta i preparati (metà dei conosciuti per eccesso); tocca un nome per la scheda e il lancio.</div>`;
  for (const L of M.livelliMagia(cl.classe)) {
    const mie = cl.con.filter(c => c.L === L);

    ${ventiOn(pg) && o.L > 0 ? '<div class="avviso">Venti della magia: dopo il sovraccarico, riuscito o fallito, si tira il tiro dei Venti (senza Forzare).</div>' : ''}
    <div class="row"><button id="tira">Tira</button><button class="pri" id="ok">Riuscita</button><button id="ko">Fallita</button></div><div id="ris"></div>`, b => {
    $('#tira', b).onclick = () => { const r = M.tira('1d20').tot; const tot = r + sv.li; $('#ris', b).innerHTML = `1d20 (${r}) + ${sv.li} = <b>${tot}</b> → ${tot >= sv.cd ? 'riuscita' : '<span class="cond">fallita</span>'}`; };
    const dopo = (li, cd) => ventiOn(pg) && o.L > 0 ? ventiBacchetta(pg, o, sv.cl, li, cd) : scheda(li, cd);
    $('#ok', b).onclick = () => { consuma(); toast(`Sovraccaricata: LI ${sv.li}, CD ${sv.cdInc}`); dopo(sv.li, sv.cdInc); };
    $('#ko', b).onclick = () => { o.noSovr = true; consuma(); toast('Sovraccarico fallito: valori della bacchetta'); dopo(o.li, o.cd); };
  });
}

carica();
applicaTema();
disegna();
</script>
